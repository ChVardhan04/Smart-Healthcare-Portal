spring.application.name=smart-healthcare-system

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3307/smart_healthcare?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Load seed data (symptoms + diseases) once on first startup. Safe to leave on -
# the DataSeeder checks if data already exists before inserting.
spring.sql.init.mode=never

# ---- JWT ----
app.jwtSecret=change-this-to-a-long-random-secret-in-production-min-32-chars
app.jwtExpirationMs=86400000

# ---- Mail (optional - app degrades gracefully without it, see EmailService) ----
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

server.port=8080
